<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>login-form.html</title>
    <link rel="stylesheet" href="login-form.css">
</head>

<body>
    <div class="image-container">
        <img src="images/image-photo.jpg" alt="Profile Image">
    </div>

    <main>
        <h1>Flat Business Profile Widget</h1>
        <form>
            <div class="input-group">
                <img src="images/user.png" alt="User Icon">
                <input type="text" placeholder="Name">
            </div>

            <div class="input-group">
                <img src="images/pass.png" alt="Password Icon">
                <input type="password" placeholder="••••••••">
            </div>

            <input type="submit" value="Submit">
        </form>
    </main>

    <footer>
        &copy; 2016 Flat Business Profile Widget. All rights reserved
    </footer>
</body>

</html>
